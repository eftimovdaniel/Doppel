<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doppel — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="login">
  <header>
    <a class="brand" href="index.html">
      <span class="mark" aria-hidden="true"><b>D</b><span class="stripes"><i></i><i></i></span></span>
      <span>
        <span class="word">DOPP<em>E</em>L</span>
        <span class="rule"></span>
      </span>
    </a>
    <nav>
      <a href="register.html">Register</a>
    </nav>
  </header>

  <main class="auth">
    <div class="kicker">ACCOUNT</div>
    <h1>Login</h1>
    <p class="sub">Sizes and alerts stay with the account. The photo still only names the piece.</p>
    <form id="login-form">
      <label class="field">Email<input type="email" name="email" autocomplete="email" required></label>
      <label class="field">Password<input type="password" name="password" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit">Login</button>
      <p class="error" data-error></p>
    </form>
    <p class="note" data-notice></p>
    <p class="note"><a href="forgot.html">Forgot password</a> · No account yet? <a href="register.html">Register</a></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
